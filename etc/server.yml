server:
  # Optional. Prepended to every backend route, for example /tenant-a/mockserver/api/v1/admin.
  api_prefix: ""

db:
  database_groups:
    default:
      host: "127.0.0.1"
      port: 3306
      user: "root"
      password: "123456"
      database_name: "mockserver_db"
      debug: true

auth:
  # Local debug secret. Override with MOCKSERVER_AUTH_JWT_SECRET in shared environments.
  jwt_secret: "mockserver-debug-secret"
  debug_login_enabled: true
